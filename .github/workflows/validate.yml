name: validate

on:
  push:
    paths:
      - "v4-cn-direct.json"
      - "scripts/validate.py"
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 校验规则集格式
        run: python scripts/validate.py
